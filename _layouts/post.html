---
layout: default
---
<article class="post" aria-labelledby="post-title">
  <header class="post-head">
    <p class="kicker">Notebook Entry</p>
    <h1 id="post-title">{{ page.title }}</h1>
    <div class="meta-row">
      <time class="meta" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% if page.author %}<span class="meta">Author: {{ page.author }}</span>{% endif %}
    </div>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="content">
    {{ content }}
  </div>
</article>
